<button 
    (click)="searchByNombreCategoria()" 
    class="flex flex-col justify-center items-center gap-2
        w-28 py-2 px-4 rounded-md text-sm duration-150 ease-in-out hover:scale-105" 
    [ngClass]="{
    'text-white font-bold from-orange-400 to-orange-500 bg-gradient-to-r hover:from-orange-500 hover:to-orange-600 ': isActive(),

    'bg-zinc-100 text-neutral-600 border border-neutral-200 hover:bg-orange-100 hover:border hover:border-orange-500 hover:text-orange-500': !isActive()
    }">

    <div>
        <app-hamburger-icon></app-hamburger-icon>
    </div>
    <span class="text-sm" [class.font-bold]="isActive()" [class.font-medium]="!isActive()">
        {{ text }}
    </span>
    
</button>
