<div class="py-2 flex items-center border-neutral-200 border-b justify-center w-full h-24">

  <app-arrow-button (onClick)="scrollLeft()" direction="left"></app-arrow-button>

    <div
      class="flex px-3 overflow-hidden whitespace-nowrap gap-x-2 w-full categorias-container items-center border-l-2 border-r-2 py-1 scrollbar-hide category-bar" #categoryBar
    >

        <app-category-item text="Todas" iconName="grid">
        </app-category-item>

        <app-category-item
            *ngFor="let categoria of categories$ | async"
            [text]="categoria.nombre"
            [iconName]="getIconName(categoria.nombre)">
        </app-category-item>


    </div>

  <app-arrow-button (onClick)="scrollRight()" direction="right"></app-arrow-button>

</div>
