<section *ngIf="tienda$ | async as tienda" class="flex flex-col p-5 gap-5">
    <!-- <app-perfil-tienda [tienda]="tienda"></app-perfil-tienda> -->

    <app-store-profile [tienda]="tienda"></app-store-profile>


    <div>
        <app-section-bar [secciones]="tienda.secciones" [control]="wordFilter"></app-section-bar>


        <div class="flex flex-col border rounded-b-xl p-7">

          <ng-container *ngIf="!wordFilter.value; else filteredView">
            <div *ngFor="let seccion of tienda.secciones; let first = first">

              <ng-container *ngIf="seccion.productos.length > 0">
                <div class="flex flex-col gap-3 border-b border-b-gray-300 pb-10 pt-7"
                     [class.pt-7]="!first">

                  <h1 class="text-2xl font-bold">{{seccion.nombre}}</h1>

                  <div class="flex gap-4 w-full h-fit flex-wrap ">
                    <ng-container *ngFor="let producto of seccion.productos">
                      <!-- isOwner -->
                      <app-product-card class="max-sm:w-full" [producto]="producto"></app-product-card>
                    </ng-container>

                  </div>
                </div>

              </ng-container>

            </div>
          </ng-container>

          <ng-template #filteredView>
            <div class="flex gap-4 w-full h-fit flex-wrap">
              <ng-container *ngFor="let producto of filteredProducts">
                <app-product-card class="max-sm:w-full" [producto]="producto"></app-product-card>
              </ng-container>
            </div>

            <!-- No hay resultados -->
            <div *ngIf="filteredProducts.length === 0" class="flex justify-center items-center p-10">
              <p class="text-gray-500">
                No se encontraron productos.
              </p>
            </div>
          </ng-template>

        </div>
    </div>

</section>
